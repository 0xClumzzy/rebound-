palette = "noctalia"
command_timeout = 2000

format = """
[┌─[](fg:dim)[$user](fg:bright bold)[](fg:dim)─[](fg:dim)[ $path ](fg:mid)[](fg:dim)$git_branch$git_status](fg:dim)$python$nodejs$rust$cmd_duration
[└─](fg:dim)[0x❯](fg:bright bold) """

right_format = '$memory_usage$time'

# ── User ──────────────────────────────────────
[username]
show_always = true
format = "[$user]($style)"
style_user = "fg:bright bold"
style_root = "fg:accent bold"

# ── Directory ─────────────────────────────────
[directory]
format = "[ $path]($style)"
style = "fg:mid bold"
truncation_length = 3
truncate_to_repo = true
read_only = " ro"
home_symbol = "~"

# ── Git ───────────────────────────────────────
[git_branch]
format = "─[](fg:dim)[@$branch]($style)[](fg:dim)"
style = "fg:mid"
symbol = ""

[git_status]
format = "[$all_status$ahead_behind]($style) "
style = "fg:accent bold"
conflicted = "!!"
ahead = "↑${count}"
behind = "↓${count}"
diverged = "↕${ahead_count}↓${behind_count}"
untracked = "?"
stashed = "≡"
modified = "~"
staged = "+${count}"
deleted = "-"

# ── Runtimes ──────────────────────────────────
[nodejs]
format = " [node:$version]($style)"
style = "fg:dim"
symbol = ""

[python]
format = " [py:$version]($style)"
style = "fg:dim"
symbol = ""

[rust]
format = " [rs:$version]($style)"
style = "fg:dim"
symbol = ""

# ── Cmd duration ──────────────────────────────
[cmd_duration]
min_time = 9000
format = " [took $duration]($style)"
style = "fg:mid"
show_notifications = true

# ── Memory prompt ──────────────────────────────
[memory_usage]
disabled = false
threshold = 75
format = "[mem:$ram]($style) "
style = "fg:accent bold"

[time]
disabled = false
format = "[$time]($style)"
style = "fg:dim"
time_format = "%H:%M:%S"

# ── Character ─────────────────────────────────
[character]
success_symbol = "[0x❯](fg:bright bold)"
error_symbol = "[0x❯](fg:accent bold)"
vimcmd_symbol = "[0x❮](fg:mid bold)"

# ── localip: banned ───────────────────────────
[localip]
disabled = true

# ──────────────────────────────────────────────
#  NOCTALIA PALETTE (do not edit)
# ──────────────────────────────────────────────
[palettes.noctalia]
# core grays
bright    = "#e0e0e0"
